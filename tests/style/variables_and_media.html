<!DOCTYPE html>
<html>
<head>
<style>
  :root { --gap: 8px; --tint: rgb(1, 2, 3); }
  #vars { padding: var(--gap); color: var(--tint); }
  #fallback { margin: var(--missing, 5px); }
  #wide { width: 100px; }
  @media (min-width: 700px) { #wide { width: 200px; } }
  @media (max-width: 500px) { #wide { width: 300px; } }
  #logical { margin-inline-start: 4px; writing-mode: vertical-rl; }
  #dir { direction: rtl; padding-inline-start: 9px; }
  @layer base, theme;
  @layer base { #layered { color: red; } }
  @layer theme { #layered { color: blue; } }
  #unlayered { color: red; }
  @layer theme { #unlayered { color: blue; } }
</style>
</head>
<body>
<div id="vars"></div>
<div id="fallback"></div>
<div id="wide"></div>
<div id="logical"></div>
<div id="dir"></div>
<div id="layered"></div>
<div id="unlayered"></div>
