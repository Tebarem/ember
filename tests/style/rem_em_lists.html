<!DOCTYPE html>
<html id="root">
<head>
<style>
  html { font-size: 20px; padding: 1rem; }
  #a { margin-top: 1rem; }
  #b { font-size: 2em; margin-top: 1em; }
  #c { font-size: 20px; border-top-left-radius: .5em; }
  #d { font-size: 20px; box-shadow: 0 0 1em rgb(255, 0, 0); }
  #e { font-size: 20px; text-shadow: 1em 1em rgb(0, 0, 255); }
  #f { font-size: 20px; background-position: 1em 2em; }
  #g { font-size: 20px; transform: translate(1em, 2em); }
  #h { margin-top: 2rem; }
</style>
</head>
<body>
<div id="a"></div>
<div id="b"></div>
<div id="c"></div>
<div id="d"></div>
<div id="e"></div>
<div id="f"></div>
<div id="g"></div>
<section id="h"><div id="i" style="margin-top: 1rem"></div></section>
