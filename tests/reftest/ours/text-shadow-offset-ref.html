<!DOCTYPE html>
<meta charset="utf-8">
<title>text-shadow offset reference</title>
<style>
body { margin: 8px; background: #fff; }
p { margin: 0; font: 24px sans-serif; color: #000; text-decoration: underline; position: relative; }
span { position: absolute; top: 0; text-decoration: underline; }
</style>
<p>HI<span style="left: 60px; top: 10px; color: #0a0">HI</span><span style="left: 90px; color: #00f">HI</span></p>
