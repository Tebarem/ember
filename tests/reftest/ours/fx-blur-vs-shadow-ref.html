<!DOCTYPE html>
<meta charset="utf-8">
<title>a blurred box-shadow equals a blurred black box under the element (reference)</title>
<style>
body { margin: 0; background: #fff }
.a { position: absolute }
</style>
<div class="a" style="left:60px;top:60px;width:80px;height:50px;background:#000;filter:blur(10px)"></div>
<div class="a" style="left:60px;top:60px;width:80px;height:50px;background:#fff"></div>
<div class="a" style="left:264px;top:66px;width:84px;height:54px;background:#00f;border-radius:18px;filter:blur(6px)"></div>
<div class="a" style="left:260px;top:60px;width:80px;height:50px;background:#fff;border-radius:16px"></div>
