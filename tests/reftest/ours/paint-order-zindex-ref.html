<!DOCTYPE html>
<meta charset="utf-8">
<title>Paint order reference: the visible pieces, side by side without overlap</title>
<style>
body { margin: 0; background: #fff }
.r { position: absolute }
</style>
<!-- the gray panel hides the red z-index -1 box completely -->
<div class="r" style="left:10px;top:10px;width:300px;height:80px;background:#ccc"></div>
<!-- the blue block (40,100)-(100,160) is covered by the green float (80,100)-(140,160) from x = 80 -->
<div class="r" style="left:40px;top:100px;width:40px;height:60px;background:#00f"></div>
<div class="r" style="left:80px;top:100px;width:60px;height:60px;background:#0a0"></div>
<!-- the orange box (120,40)-(180,100) is covered by z1 (150,20)-(210,80) and z2 (170,40)-(230,100) -->
<div class="r" style="left:120px;top:40px;width:30px;height:60px;background:#f80"></div>
<div class="r" style="left:150px;top:80px;width:20px;height:20px;background:#f80"></div>
<!-- z1 is covered by z2 -->
<div class="r" style="left:150px;top:20px;width:60px;height:20px;background:#808"></div>
<div class="r" style="left:150px;top:40px;width:20px;height:40px;background:#808"></div>
<div class="r" style="left:170px;top:40px;width:60px;height:60px;background:#0cc"></div>
