<!DOCTYPE html>
<meta charset="utf-8">
<title>R4e: a CSS mask-image gradient on an SVG element, and a mask element on an html box</title>
<link rel="match" href="svgfx-mask-gradient-ref.html">
<style>
body { margin: 0; background: #fff }
svg { position: absolute; left: 0; top: 0 }
#box { position: absolute; left: 200px; top: 20px; width: 80px; height: 80px; background: #0a0; mask: url(#m) }
</style>
<svg width="190" height="120">
  <rect x="20" y="20" width="100" height="80" fill="#00f" style="mask-image: linear-gradient(to right, #000 50%, transparent 50%)"/>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="80"><rect width="40" height="80" fill="#fff"/></mask>
</svg>
<div id="box"></div>
