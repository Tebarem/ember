<!DOCTYPE html>
<meta charset="utf-8">
<title>Sticky reference at scroll 260: scrolled to 260 once, header A pinned with a relative offset</title>
<link rel="stylesheet" href="/fonts/ahem.css">
<meta name="ember-steps" content="scroll 0 260; render">
<style>
html { overflow: hidden }
body { margin: 0; font: 20px/30px Ahem; color: #000; background: #fff }
.sec h2 { margin: 0; height: 30px; font: 20px/30px Ahem; background: #36c; color: #fff; padding-left: 10px }
.sec .c { height: 300px; background: #eee; border-bottom: 4px solid #999 }
/* sections are 334px tall; the viewport top is at 260, so header A (sticky top 8) sits at 268 */
#a h2 { position: relative; top: 268px }
</style>
<div class="sec" id="a"><h2>A</h2><div class="c"></div></div>
<div class="sec"><h2>B</h2><div class="c"></div></div>
<div class="sec"><h2>C</h2><div class="c"></div></div>
<div class="sec"><h2>D</h2><div class="c"></div></div>
