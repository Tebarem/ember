<!DOCTYPE html>
<meta charset="utf-8">
<title>Scrolled content with sticky headers, drawn by the damage path</title>

.sec .c { height: 300px; background: #eee; border-bottom: 4px solid #999 }
</style>
<div class="sec"><h2>A</h2><div class="c"></div></div>
<div class="sec"><h2>B</h2><div class="c"></div></div>
