<!doctype html>
<html><head><meta charset="utf-8"><title>iframe parent</title></head>
<body style="margin:0;background:#0000ff">
<iframe id="f" src="child.html" style="position:absolute;left:20px;top:20px;width:100px;height:60px;border:0"></iframe>
<div id="cover" style="position:absolute;left:60px;top:60px;width:20px;height:20px;background:#ffff00"></div>
<script>
window.loads = 0;
document.getElementById('f').addEventListener('load', function () { window.loads++; });
</script>
</body></html>
