<!DOCTYPE html>
<meta charset="utf-8">
<title>Grid: fixed, fr and gap tracks</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<style>
body { margin: 0 }
#g { display: grid; position: relative; width: 300px; grid-template-columns: 50px 1fr 100px;
     grid-template-rows: 40px 30px; column-gap: 20px; row-gap: 10px }
#a { grid-column: 1; grid-row: 1 }
#b { grid-column: 2; grid-row: 1 }
#c { grid-column: 3; grid-row: 1 }
#d { grid-column: 2; grid-row: 2 }
</style>
<body onload="checkLayout('#g > div')">
<!--
Derivation (CSS Grid 2 section 12.7): the free space in the inline axis is 300 - 50 - 100 - 2 * 20 (column
gaps) = 110, and the only fr track gets all of it, so column 2 is 110px wide. Column 2 starts at 50 + 20 = 70,
column 3 at 70 + 110 + 20 = 200. The rows are fixed at 40px and 30px with a 10px row gap, so row 2 starts at
40 + 10 = 50. Items stretch to their tracks (justify-self and align-self are normal).
Provenance: derived by hand; not run in Chromium in this environment.
-->
<div id="g">
  <div id="a" data-expected-width="50" data-expected-height="40" data-offset-x="0" data-offset-y="0"></div>
  <div id="b" data-expected-width="110" data-expected-height="40" data-offset-x="70" data-offset-y="0"></div>
  <div id="c" data-expected-width="100" data-expected-height="40" data-offset-x="200" data-offset-y="0"></div>
  <div id="d" data-expected-width="110" data-expected-height="30" data-offset-x="70" data-offset-y="50"></div>
</div>
</body>
