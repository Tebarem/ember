<!DOCTYPE html>
<meta charset="utf-8">
<title>Grid: auto-placement with a column-locked item between auto items</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<style>
body { margin: 0 }
.g { display: grid; position: relative; width: 100px; grid-template-columns: 50px 50px; grid-auto-rows: 20px }
.g > div { height: 20px }
.sparse { grid-auto-flow: row }
.dense { grid-auto-flow: row dense }
#a1 { } #b1 { grid-column: 1 } #c1 { }
#a2 { } #b2 { grid-column: 1 } #c2 { }
</style>
<body onload="checkLayout('.g > div')">
<!--
Derivation (CSS Grid 2 section 8.5, step 4 with one cursor for the items in order). Sparse: #a1 is auto and
takes row 1, column 1, so the cursor is at column 2 of row 1. #b1 is locked to column 1, which is behind the
cursor, so it moves to row 2 (x 0, y 20). The cursor is now at column 1 of row 2, #c1 is auto and skips #b1's
cell, so it takes row 2 column 2 (x 50, y 20).
Dense: each item restarts the search at the first row, so #b1 is placed in row 2 as before, and #c1 searches
from row 1 and takes row 1 column 2 (x 50, y 0). The second grid is the dense case.
Provenance: derived by hand; not run in Chromium in this environment.
-->
<div class="g sparse">
  <div id="a1" data-expected-width="50" data-expected-height="20" data-offset-x="0" data-offset-y="0"></div>
  <div id="b1" data-expected-width="50" data-expected-height="20" data-offset-x="0" data-offset-y="20"></div>
  <div id="c1" data-expected-width="50" data-expected-height="20" data-offset-x="50" data-offset-y="20"></div>
</div>
<div class="g dense">
  <div id="a2" data-expected-width="50" data-expected-height="20" data-offset-x="0" data-offset-y="0"></div>
  <div id="b2" data-expected-width="50" data-expected-height="20" data-offset-x="0" data-offset-y="20"></div>
  <div id="c2" data-expected-width="50" data-expected-height="20" data-offset-x="50" data-offset-y="0"></div>
</div>
</body>
