<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: a wide line before a br</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>

body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 60px }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: 'XX XX XX' needs 160px, so in 60px each XX is its own line (40px, the space hangs). Then 'YY' follows the br on its own line. Four lines, height 80, and YY is at y 60. -->
<div id="d" class="a" data-expected-width="60" data-expected-height="80">XX XX XX<br><span id="y" data-offset-x="0" data-offset-y="60" data-expected-width="40" data-expected-height="20">YY</span></div>
</body>
