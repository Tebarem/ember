<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: overflow-wrap break-word breaks a long word</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 60px; overflow-wrap: break-word }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS Text 3 section 5.5. With no other opportunity, break-word breaks the word where it
overflows: XXX on line 1 and XX on line 2. Height 40. -->
<div id="d" class="a" data-expected-width="60" data-expected-height="40">XXXXX</div>
</body>
