<!DOCTYPE html>

<title>Inline layout: word-break break-all breaks between any characters</title>

<script src="/resources/testharnessreport.js"></script>

<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 60px; word-break: break-all }

</body>
