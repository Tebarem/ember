<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: an empty inline with padding makes a box</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 100px }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS 2.1 10.8. An empty inline box with padding-left 10px still has a border box: 10px wide,
with the content area height of 20px. XX follows it at x 10. -->
<div id="d" class="a" data-expected-width="100" data-expected-height="20"><span id="e" style="padding-left:10px" data-offset-x="0" data-offset-y="0" data-expected-width="10" data-expected-height="20"></span><span id="x" data-offset-x="10" data-offset-y="0" data-expected-width="40" data-expected-height="20">XX</span></div>
</body>
