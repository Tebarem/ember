<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: text-align match-parent resolves against the parent's direction</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #outer { width: 100px; direction: rtl; text-align: start } #d { direction: ltr; text-align: match-parent }
</style>
<body onload="checkLayout('#d')">
<!-- UNVERIFIED (derived by hand, not checked in Chromium). Derivation: CSS Text 3 section 7.1. match-parent takes the parent's value start, which resolves against the
parent's rtl direction, so the child's XX is at the right, 60 to 100. -->
<div id="outer"><div id="d" class="a" data-expected-width="100" data-expected-height="20"><span id="s" data-offset-x="60" data-offset-y="0" data-expected-width="40" data-expected-height="20">XX</span></div></div>
</body>
