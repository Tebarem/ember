<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: vertical-align bottom aligns the box with the line box bottom</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 300px }
</style>
<body onload="checkLayout('#d')">
<!-- UNVERIFIED: derived by hand from the specs, not yet checked in Chromium. Derivation: CSS 2.1 10.8.1. Same boxes as vertical-align-top: the span's inline box is 40px tall (23 above its baseline, 17 below) and makes the line box 40px tall. Bottom aligns its bottom with the line box bottom, so the span fills the line and its content area starts at y 15 as before. The strut moves to the bottom: its baseline is at 40 - 4 = 36, so the plain span x is at y 36 - 16 = 20. -->
<div id="d" class="a" data-expected-width="300" data-expected-height="40"><span id="x" data-offset-x="0" data-offset-y="20" data-expected-width="40" data-expected-height="20">XX</span><span id="s" style="vertical-align:bottom;font-size:10px;line-height:40px" data-offset-x="40" data-offset-y="15" data-expected-width="20" data-expected-height="10">YY</span></div>
</body>
