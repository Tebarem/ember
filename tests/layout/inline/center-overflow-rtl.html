<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: centered overflow in rtl starts at the right edge</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 40px; direction: rtl; text-align: center; white-space: nowrap }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS Text 3 section 7.1. The 80px content does not fit. Overflow is start-aligned, and in
rtl the start edge is the right one, so the content runs from 40 - 80 = -40 to 40. -->
<div id="d" class="a" data-expected-width="40" data-expected-height="20"><span id="s" data-offset-x="-40" data-offset-y="0" data-expected-width="80" data-expected-height="20">XXXX</span></div>
</body>
