<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: an inline box with padding breaks across lines</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 100px }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS 2.1 10.8 and CSS Text 3 section 5. The span's start padding (10px) is on its first fragment
only and its end padding on its last. Line 1 is padding 10 + XX (the space hangs), line 2 is XX, line 3 is XX +
end padding 10. Three lines, height 60. -->
<div id="d" class="a" data-expected-width="100" data-expected-height="60"><span id="s" style="padding-left:10px;padding-right:10px">XX XX XX</span></div>
</body>
