<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: br breaks a nowrap line</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>

body { margin: 0 } .a { font: 20px/20px Ahem } #d { white-space: nowrap }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: nowrap prevents soft wraps only; a br is still a forced break. Two lines, height 40. -->
<div id="d" class="a" data-expected-width="800" data-expected-height="40">XX<br><span id="y" data-offset-x="0" data-offset-y="20" data-expected-width="40" data-expected-height="20">YY</span></div>
</body>
