<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: vertical-align text-top with a fixed line-height</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/40px Ahem } #d { width: 300px }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS 2.1 10.8.1 and the WPT reftests vertical-align-117a, -118a and -negative-leading-001. The line-height is 40px (inherited by the span), so the strut is 26 above the baseline and 14 below (ascent 16 + 10, descent 4 + 10) and the span's inline box is 23 above its baseline and 17 below (8 + 15, 2 + 15). Text-top aligns the top of the span's inline box, its half-leading included, with the top of the parent's content area (16 above the parent baseline), so the span baseline is 23 - 16 = 7px below the parent baseline. The span's box reaches 17 + 7 = 24 below the parent baseline (the strut reaches 14). The line box is 26 + 24 = 50px tall with the baseline at 26. The plain span x (content area 16 above the baseline) starts at y 10, and the span s at y 26 + 7 - 8 = 25. -->
<div id="d" class="a" data-expected-width="300" data-expected-height="50"><span id="x" data-offset-x="0" data-offset-y="10" data-expected-width="40" data-expected-height="20">XX</span><span id="s" style="vertical-align:text-top;font-size:10px" data-offset-x="40" data-offset-y="25" data-expected-width="20" data-expected-height="10">YY</span></div>
</body>
