<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: hyphens none ignores a soft hyphen</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 100px; hyphens: none }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS Text 3 section 5.3. With hyphens none the soft hyphen is not a break and shows nothing.
The 160px word is one line that overflows the 100px box. Height 20. -->
<div id="d" class="a" data-expected-width="100" data-expected-height="20">XXXX&shy;XXXX</div>
</body>
