<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: text-align start in rtl aligns to the right</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 100px; direction: rtl }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: text-align start resolves to the right edge in an rtl block. XX is 40px and sits at 60 to 100. -->
<div id="d" class="a" data-expected-width="100" data-expected-height="20"><span id="s" data-offset-x="60" data-offset-y="0" data-expected-width="40" data-expected-height="20">XX</span></div>
</body>
