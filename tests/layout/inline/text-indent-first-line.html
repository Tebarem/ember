<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: text-indent applies to the first line only</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 100px; text-indent: 20px }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS Text 3 section 8.1. The first line has 80px: XX fits and XX XX does not. Line 2 has the full
100px but holds one XX. Height 40. -->
<div id="d" class="a" data-expected-width="100" data-expected-height="40">XX XX</div>
</body>
