<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: a float at the start of a line shortens its band</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>
body { margin: 0 } .a { font: 20px/20px Ahem } #d { width: 100px }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: CSS 2.1 9.5.1 rule 6 and 9.4.2. The 30px float is placed at the top of the line, so line 1 is
the 70px band from x 30: XX fits and XX YY does not. Line 2 starts at y 20, below the float (its bottom
edge is at 20), so its band is the full 100px: YY ZZ fits. Height 40. -->
<div id="d" class="a" data-expected-width="100" data-expected-height="40"><span id="f" style="float:left;width:30px;height:20px" data-offset-x="0" data-offset-y="0" data-expected-width="30" data-expected-height="20"></span><span id="a" data-offset-x="30" data-offset-y="0" data-expected-width="40" data-expected-height="20">XX</span> <span id="b" data-offset-x="0" data-offset-y="20" data-expected-width="40" data-expected-height="20">YY</span> <span id="c" data-offset-x="60" data-offset-y="20" data-expected-width="40" data-expected-height="20">ZZ</span></div>
</body>
