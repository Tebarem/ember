<!DOCTYPE html>
<meta charset="utf-8">
<title>Inline layout: a bare br between two words</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<link rel="stylesheet" href="/fonts/ahem.css">
<style>

body { margin: 0 } .a { font: 20px/20px Ahem }
</style>
<body onload="checkLayout('#d')">
<!-- Derivation: a br is a forced break. XX is 40px and ends line 1; YY starts line 2 at y 20. Two lines, height 40. The block has its auto width of the 800px viewport. -->
<div id="d" class="a" data-expected-width="800" data-expected-height="40">XX<br><span id="y" data-offset-x="0" data-offset-y="20" data-expected-width="40" data-expected-height="20">YY</span></div>
</body>
