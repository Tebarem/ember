<!DOCTYPE html>
<meta charset="utf-8">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/check-layout-th.js"></script>
<title>visibility: collapse removes the row from the table height</title>
<style>body { margin: 0 } table { border-spacing: 0 } td { padding: 0 }</style>
<body onload="checkLayout('table, tr')">
<!-- Derivation: CSS Tables 3 section 3.6. A collapsed row has no height, so the table is only as tall as
the visible row, 20px. The collapsed row is 0px tall. -->
<table data-expected-width="50" data-expected-height="20">
  <tr style="visibility: collapse" data-expected-height="0"><td style="height: 30px"><div style="width: 50px; height: 30px"></div></td></tr>
  <tr data-expected-height="20"><td><div style="width: 50px; height: 20px"></div></td></tr>
</table>
</body>
